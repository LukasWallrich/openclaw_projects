<!doctype html>
<!-- LAYOUT: "Companion" (a narrow strip that lives beside the Meet window).
     Idea: the lobby is a 400px column you keep docked next to Google Meet, or pop out as its own small window.
     Why: the lobby normally disappears behind the Meet tab, so people never move on. This one stays in view.
     Trade-off: no overview at a glance; everything is a list, and only one section is visible at a time. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossroads · Companion</title>
<style>:root{--ink:#1b2420;--muted:#5f6b64;--paper:#f6f4ee;--card:#fffefa;--line:#dcd7c9;--green:#1f6b4e;--green-soft:#deeee4;--amber:#b86e14;--amber-soft:#f7e7cc;--blue:#2f679a;--blue-soft:#e0ebf5;--night:#18201c;--gold:#f0c34d;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
button,input,textarea{font:inherit;color:inherit}h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .4em}h2{font-size:1.35rem}h3{font-size:1.05rem}p{margin:0 0 .7em}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}

.btn{border:1px solid var(--line);background:var(--card);padding:.5em .95em;border-radius:8px;cursor:pointer;font-weight:600}.btn:hover{border-color:var(--ink)}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.primary:hover{background:#17553e}.btn.sm{padding:.28em .7em;font-size:.84rem}.btn:disabled{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:inherit;font-size:inherit}
.chip{display:inline-flex;align-items:center;gap:.3em;border:1px solid var(--line);border-radius:99px;padding:.12em .7em;font-size:.8rem;background:var(--card)}.chip.toggle{cursor:pointer}.chip.toggle[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}.chip.timer{background:var(--amber-soft);border-color:#e6cf9f}.chips{display:flex;flex-wrap:wrap;gap:.35em}
.av{--s:36px;width:var(--s);height:var(--s);flex:none;border-radius:50%;background:var(--c);display:inline-grid;place-items:center;font-size:calc(var(--s)*.36);font-weight:700;color:#1b2420}.av.sm{--s:28px}.av.lg{--s:60px}
.dot{width:.6em;height:.6em;border-radius:50%;display:inline-block;margin-right:.4em;background:#aab2ac}.dot.room,.dot.duo{background:var(--green)}.dot.lobby{background:var(--blue)}.dot.waiting{background:var(--amber)}
.prow{display:flex;gap:.7em;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.65em .75em;cursor:pointer}.prow:hover{border-color:var(--ink)}.prow-main{display:flex;flex-direction:column;min-width:0}.prow-sub{font-size:.84rem;color:var(--muted)}.prow-loc{font-size:.8rem;margin:0}
.pmini{display:flex;gap:.6em;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:.5em 0;cursor:pointer;font-size:.88rem}.pmini:hover strong{text-decoration:underline}.tlabel{font-size:.78rem;font-weight:700;margin:.7em 0 0;color:var(--muted)}
.seats{display:inline-flex;gap:3px}.seat{width:22px;height:22px;border-radius:50%;border:1.5px dashed #b9b3a3;display:inline-grid;place-items:center;font-size:.58rem;font-weight:700;font-style:normal}.seat.on{border:0;background:var(--c)}
.st-line{display:flex;gap:.6em;align-items:center}.st-actions{display:flex;flex-wrap:wrap;gap:.4em;align-items:center;margin-top:.5em}.nudge{margin-top:.6em;background:var(--amber-soft);border-radius:8px;padding:.5em .7em;font-size:.88rem}
.pairbox{display:flex;flex-direction:column;gap:.35em;align-items:flex-start;background:var(--blue-soft);border-radius:10px;padding:.7em .8em}.duo-actions{display:flex;flex-wrap:wrap;gap:.5em}
.duolist,.metlist{list-style:none;margin:.7em 0 0;padding:0}.duolist li,.metlist li{display:flex;gap:.5em;align-items:center;padding:.45em 0;border-top:1px solid var(--line);font-size:.88rem}.duolist li>span:not(.av),.metlist li>span:not(.av){flex:1;min-width:0}.duolist .busy .av+.av{margin-left:-14px}
.demo-tag{font-size:.74rem;border:1px dashed currentColor;border-radius:99px;padding:.1em .6em;opacity:.8;white-space:nowrap}.seg{display:inline-flex;border:1px solid currentColor;border-radius:8px;overflow:hidden;opacity:.9}.seg button{background:none;border:0;padding:.15em .6em;cursor:pointer;font-size:.8rem}.seg button[aria-pressed=true]{background:var(--gold);color:#1b2420;font-weight:700}
dialog{border:0;border-radius:14px;padding:1.4em;width:min(520px,calc(100vw - 24px));background:var(--card);color:var(--ink);box-shadow:0 24px 70px #0005}dialog::backdrop{background:#18201c99}
dialog label{display:block;font-size:.82rem;font-weight:700;margin:.7em 0 0}dialog input,dialog textarea{display:block;width:100%;margin-top:.25em;padding:.5em .6em;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:400}fieldset{border:0;padding:0;margin:.7em 0 0}legend{font-size:.82rem;font-weight:700;padding:0;margin-bottom:.3em}
.dlg-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.5em;margin-top:1.1em}.pcard-head{display:flex;gap:1em;align-items:center;margin-bottom:.7em}.pcard-head p{margin:0}.askoffer{display:grid;grid-template-columns:auto 1fr;gap:.3em .8em;margin:.8em 0 0}.askoffer dt{font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.askoffer dd{margin:0}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6em;margin-bottom:1em}.help-opt{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:.7em;cursor:pointer;display:flex;flex-direction:column;gap:.2em}.help-opt:hover{border-color:var(--ink)}.help-opt span{font-size:.82rem;color:var(--muted)}
.chatlog{border:1px solid var(--line);border-radius:10px;padding:.6em;height:120px;overflow:auto;background:#fff}.msg{margin:0 0 .4em;display:flex}.msg span{background:var(--paper);border-radius:10px;padding:.3em .6em;max-width:85%;font-size:.88rem}.msg.me{justify-content:flex-end}.msg.me span{background:var(--green-soft)}.chatform{display:flex;gap:.4em;margin-top:.5em}.chatform input{margin:0;flex:1}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--night);color:#fff;padding:.65em 1em;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 100px);z-index:50;font-size:.9rem}#toast.show{opacity:1;transform:translate(-50%,0)}
.helpfab{position:fixed;right:18px;bottom:18px;z-index:40;background:var(--night);color:#fff;border:2px solid var(--gold);border-radius:99px;padding:.6em 1.1em;font-weight:700;cursor:pointer;box-shadow:0 8px 24px #0003}.helpfab:hover{background:#000}
@media (max-width:480px){.help-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

body{display:flex;min-height:100vh;background:#232b27}
.ghost{flex:1;display:grid;place-items:center;color:#fff8;text-align:center;padding:2em;background:repeating-linear-gradient(135deg,#232b27 0 22px,#262f2a 22px 44px)}.ghost div{max-width:360px;border:1.5px dashed #fff4;border-radius:16px;padding:2em}.ghost strong{display:block;color:#fffc;font-family:var(--serif);font-size:1.3rem;margin-bottom:.4em}
.comp{width:420px;max-width:100%;background:var(--paper);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.chead{background:var(--night);color:#fffdf7;padding:.65em .9em;display:flex;flex-wrap:wrap;gap:.5em;align-items:center}.brand{font-family:var(--serif);font-weight:800;font-size:1.1rem;margin-right:auto}.chead .btn{background:none;color:#fff;border-color:#fff5}
.me{background:var(--card);border-bottom:1px solid var(--line);padding:.8em .9em}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);background:var(--card)}.tabs button{white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;padding:.6em .1em;cursor:pointer;font-weight:600;font-size:.84rem}.tabs button[aria-selected=true]{border-color:var(--green);color:var(--green)}
.pane{flex:1;overflow:auto;padding:.8em .9em}.pane input[type=search]{width:100%;padding:.6em .8em;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:.7em}
.acc{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px;overflow:hidden}.acc.sel{border-color:var(--green)}.acc-h{width:100%;display:grid;grid-template-columns:1fr auto;gap:.1em .5em;text-align:left;background:none;border:0;padding:.65em .75em;cursor:pointer}.acc-h .fine{grid-column:1/-1}.acc-b{padding:0 .75em .75em}.acc-b blockquote{margin:.4em 0 .6em;padding-left:.7em;border-left:3px solid var(--gold);font-family:var(--serif);font-style:italic;font-size:.92rem}.acts{display:flex;flex-wrap:wrap;gap:.4em;margin-top:.6em}
.plist{display:flex;flex-direction:column;gap:6px}.cfoot{border-top:1px solid var(--line);background:var(--card);padding:.6em .9em;display:flex;gap:.5em;align-items:center;justify-content:space-between}.cfoot .btn{flex:1}
#toast{left:auto;right:16px;transform:translateY(20px);max-width:388px}#toast.show{transform:none}
@media (max-width:760px){.ghost{display:none}.comp{width:100%}}
.panel .ghost{display:none}.panel .comp{width:100%}.panel #floatbtn{display:none}
.floated .comp{opacity:.35;pointer-events:none}
</style></head><body>
<div class="ghost" aria-hidden="true"><div><strong>Your Google Meet window</strong>Crossroads sits beside it as a narrow strip, so moving to the next conversation is always one click away.</div></div>
<div class="comp">
  <header class="chead"><span class="brand">Crossroads</span><span id="scen"></span><button class="btn sm" data-act="float" id="floatbtn" title="Keep the lobby on top of your Meet window">Float over Meet</button></header>
  <section class="me" id="status" aria-live="polite"></section>
  <div class="tabs" role="tablist" id="tabs"></div>
  <main class="pane" id="pane" role="tabpanel"></main>
  <footer class="cfoot"><button class="btn" data-act="help">Help desk · talk to an organiser</button></footer>
</div>
<script>/* ===== Crossroads demo engine (shared by the three Claude layouts). Synthetic data only. ===== */
const CAP = 6;
const ROOMS = [
  {id:'workflow',title:'Open workflows',topic:'Research practice',intent:'Bring a puzzle',tags:['Open science','Methods'],desc:'Practical ways to use open tools and reproducible workflows without extra burden.',prompt:'What part of your current workflow would you most like to make easier for others to reproduce?'},
  {id:'automation',title:'Human-centred automation',topic:'Research practice',intent:'Compare methods',tags:['AI tools','Methods'],desc:'Where automation genuinely helps research practice, and where human judgement must stay visible.',prompt:'Where has automation saved real time, and what still needs a careful human?'},
  {id:'collab',title:'Build something together',topic:'Research practice',intent:'Find collaborators',tags:['Collaboration','Open science'],desc:'Turn a shared research frustration into a small, useful project.',prompt:'What could a tiny team make in a month that would unblock many researchers?'},
  {id:'eval',title:'Evaluation headaches',topic:'Evaluation',intent:'Bring a puzzle',tags:['Evaluation','AI tools'],desc:'Bring an unresolved measurement or validation problem and let the room sharpen it.',prompt:'What are you measuring because it is available rather than because it is right?'},
  {id:'benchmarks',title:'Beyond benchmarks',topic:'Evaluation',intent:'Compare methods',tags:['Evaluation','Methods'],desc:'Evaluating AI-enabled research beyond single-number performance scores.',prompt:'What evidence would actually change your mind about whether a tool works?'},
  {id:'replication',title:'Replication partners',topic:'Evaluation',intent:'Find collaborators',tags:['Evaluation','Collaboration'],desc:'Replications, robustness checks, shared datasets and adversarial collaborations.',prompt:'Which influential result or tool most needs an independent stress test?'},
  {id:'incentives',title:'Broken incentives clinic',topic:'Community & policy',intent:'Bring a puzzle',tags:['Policy','Community'],desc:'Diagnose incentive problems in publishing, funding, hiring and assessment.',prompt:'Which individually rational behaviour creates the worst collective outcome in your field?'},
  {id:'governance',title:'Governance patterns',topic:'Community & policy',intent:'Compare methods',tags:['Policy','Community'],desc:'Practical models for community governance, participation and oversight.',prompt:'What decision should your community make differently, and who needs a voice in it?'},
  {id:'coalitions',title:'Coalition corner',topic:'Community & policy',intent:'Find collaborators',tags:['Collaboration','Policy'],desc:'Find allies for cross-institution initiatives, shared standards or infrastructure.',prompt:'What would become possible if three institutions coordinated instead of acting alone?'}
];
const TOPICS = ['Research practice','Evaluation','Community & policy'];
const INTERESTS = ['AI tools','Evaluation','Open science','Methods','Policy','Community','Collaboration'];
const FIRST = ['Maya','Jonas','Priya','Sam','Noor','Elliot','Ada','Luis','Mei','Tariq','Zoe','Anika','Ravi','Leah','Omar','Nina','Alex','Inez','Theo','June','Ari','Marta','Dev','Sara','Finn','Yuki','Lina','Ben','Rosa','Kofi','Elena','Max','Hana','Pablo','Ines','Tomas','Aisha','Milan','Greta','Femi','Carla','Idris','Sofia','Jun','Amara','Viktor','Lucia','Niko','Dara','Emil','Thandi','Oskar','Reem','Caleb','Ilse','Mateo','Salma','Hugo','Petra','Kwame','Laila','Anton','Bea','Rohan','Freya','Dario','Mina','Stefan','Ayo','Clara','Tarek'];
const LAST = ['Okafor','Lindqvist','Raman','Whitfield','Haddad','Marsh','Kowalski','Ferreira','Tanaka','Aziz','Brandt','Mehta','Novak','Cohen','Farouk','Petrov','Ng','Duarte','Hale','Park','Stein','Vega','Shah','Lund','Byrne','Sato','Meyer','Ortiz','Reyes','Mensah','Rossi','Keller'];
const AFFS = ['Univ. of Amsterdam','Birkbeck, London','Max Planck Inst.','Stanford METRICS','Univ. of Nairobi','Center for Open Science','TU Delft','Univ. of Melbourne','QUEST Center, Berlin','IIT Bombay','Univ. of Toronto','LMU Munich','Univ. of Cape Town','Independent researcher','Research on Research Inst.','Univ. of Tokyo'];
const ASKS = {'AI tools':'Looking for honest failure cases of LLM-assisted screening','Evaluation':'Need a validity check on my evaluation rubric','Open science':'Seeking testers for a reproducibility checklist','Methods':'Want feedback on a multiverse analysis plan','Policy':'Looking for funder contacts interested in pilot reforms','Community':'Want co-organisers for a regional reading group','Collaboration':'Seeking a partner lab for a many-analysts study'};
const OFFERS = {'AI tools':'Can share prompts and evaluation logs from three review projects','Evaluation':'Happy to review benchmark designs','Open science':'Can help set up registered report workflows','Methods':'Can advise on simulation-based power analysis','Policy':'Can explain how research assessment reform works at funders','Community':'Can share a playbook for running open online journal clubs','Collaboration':'Have a cleaned dataset of 4,000 coded papers to share'};
const COLOURS = ['#a7c7b1','#e6b892','#9dbbd5','#d6a9b7','#d7c77f','#9fc7c4','#b5afd8'];
const PEOPLE = FIRST.map((f,i)=>{ const a=INTERESTS[i%7], b=INTERESTS[(i*3+2)%7]; return {id:'p'+i,name:f+' '+LAST[(i*5)%LAST.length],aff:AFFS[(i*7)%AFFS.length],interests:a===b?[a]:[a,b],ask:ASKS[a],offer:OFFERS[b],colour:COLOURS[i%7]}; });
const SCEN = [
  {total:18,rooms:[4,0,3,4,0,0,0,0,0],duos:1,waiting:0,onBreak:1},
  {total:38,rooms:[4,5,3,5,4,3,0,2,0],duos:2,waiting:1,onBreak:2},
  {total:72,rooms:[6,8,5,9,6,5,4,6,3],duos:3,waiting:1,onBreak:4}
];
const S = {scenario:1,me:{id:'me',name:'You',aff:'Your institution',interests:['Collaboration','Evaluation'],ask:'Looking for a partner lab for a replication',offer:'Can share an annotated corpus of peer reviews',colour:'#f0c34d'},
  loc:{type:'lobby'},tables:{},duos:[],waiting:[],where:{},present:[],met:[],queued:[],pair:null,chat:[],joinedAt:null,sel:null,q:'',nudge:false};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const person = id => id==='me' ? S.me : PEOPLE.find(p=>p.id===id);
const room = id => ROOMS.find(r=>r.id===id);
const initials = p => p.name.split(' ').map(w=>w[0]).slice(0,2).join('');

function seed(i){
  S.scenario=i; const sc=SCEN[i]; let k=0; const take=n=>PEOPLE.slice(k,k+=n).map(p=>p.id);
  S.tables={}; S.where={}; S.duos=[]; S.waiting=[]; S.loc={type:'lobby'}; S.pair=null; S.queued=[]; S.joinedAt=null; S.nudge=false;
  ROOMS.forEach((r,ri)=>{ const ids=take(sc.rooms[ri]); const t=[ids.slice(0,CAP)]; if(ids.length>CAP) t.push(ids.slice(CAP)); S.tables[r.id]=t; t.forEach((tb,ti)=>tb.forEach(id=>S.where[id]={type:'room',room:r.id,table:ti})); });
  for(let d=0;d<sc.duos;d++){ const [a,b]=take(2); S.duos.push([a,b]); S.where[a]={type:'duo',other:b}; S.where[b]={type:'duo',other:a}; }
  take(sc.waiting).forEach(id=>{S.waiting.push(id);S.where[id]={type:'waiting'};});
  take(sc.onBreak).forEach(id=>S.where[id]={type:'break'});
  take(sc.total-1-k).forEach(id=>S.where[id]={type:'lobby'});
  S.present=PEOPLE.slice(0,sc.total-1).map(p=>p.id);
}
const minutesGoing = (rid,t) => (ROOMS.findIndex(r=>r.id===rid)*7+t*5+S.scenario*3)%19+2;
function locLabel(id){
  const w = id==='me' ? S.loc : S.where[id]; if(!w) return 'Not here yet';
  if(w.type==='room') return 'In '+room(w.room).title+(S.tables[w.room].length>1?' · table '+(w.table+1):'');
  if(w.type==='duo') return 'At a table for two with '+person(w.other).name.split(' ')[0];
  if(w.type==='waiting') return 'Waiting at a table for two';
  if(w.type==='break') return 'On a break';
  return 'In the lobby';
}
const locKind = id => (id==='me'?S.loc:S.where[id]||{}).type;
function stats(){ let talking=0; S.present.forEach(id=>{const t=S.where[id].type; if(t==='room'||t==='duo') talking++;}); const open=ROOMS.filter(r=>S.tables[r.id].some(t=>t.length)).length; return {talking,open,total:SCEN[S.scenario].total}; }
function search(q){ q=q.trim().toLowerCase(); const list=S.present.map(person); if(!q) return list; return list.filter(p=>[p.name,p.aff,p.ask,p.offer,...p.interests].join(' ').toLowerCase().includes(q)); }

/* ---------- actions ---------- */
function vacate(){
  const l=S.loc;
  if(l.type==='room'){ const t=S.tables[l.room][l.table]; t.splice(t.indexOf('me'),1); if(l.table>0&&!t.length) S.tables[l.room].splice(l.table,1); }
  if(l.type==='duo'&&l.other){ S.where[l.other]={type:'lobby'}; }
  S.loc={type:'lobby'}; S.joinedAt=null; S.nudge=false;
}
function meet(name){ dialog(`<p class="eyebrow">Google Meet handoff</p><h2>${esc(name)}</h2><p>The Google Meet for this conversation opens in a new tab. Keep this lobby open: it shows where you are, and it is how you move on.</p><p class="fine">Demo: no real Meet link is opened.</p><div class="dlg-actions"><button class="btn primary" data-act="close">Got it</button></div>`); }
function addMet(ids){ ids.forEach(id=>{ if(id!=='me'&&!S.met.includes(id)) S.met.unshift(id); }); }
function join(rid,t){ vacate(); const tb=S.tables[rid][t]; if(tb.length>=CAP) return toast('That table is full.'); addMet(tb); tb.push('me'); S.loc={type:'room',room:rid,table:t}; S.joinedAt=Date.now(); S.sel=rid; render(); meet(room(rid).title+(t?' · table '+(t+1):'')); }
function openTable(rid){ S.tables[rid].push([]); join(rid,S.tables[rid].length-1); }
function startDuo(pid){ vacate(); S.waiting=S.waiting.filter(x=>x!==pid); S.where[pid]={type:'duo',other:'me'}; S.loc={type:'duo',other:pid}; S.joinedAt=Date.now(); addMet([pid]); S.pair=null; render(); meet('Table for two with '+person(pid).name); }
function sitDuo(){ vacate(); S.loc={type:'waiting'}; render(); toast('You are at an open table for two. Everyone in the lobby can see it.');
  setTimeout(()=>{ if(S.loc.type!=='waiting') return; const c=S.present.find(id=>S.where[id].type==='lobby'); if(c){ toast(person(c).name+' sat down at your table.'); startDuo(c);} },5000); }
function pairMe(){ S.pair={state:'searching'}; render();
  setTimeout(()=>{ if(!S.pair||S.pair.state!=='searching') return; const c=S.present.filter(id=>['lobby','waiting'].includes(S.where[id].type)).map(id=>({id,score:person(id).interests.filter(x=>S.me.interests.includes(x)).length*2-(S.met.includes(id)?3:0)})).sort((a,b)=>b.score-a.score)[0];
    if(!c){ S.pair=null; render(); return toast('Nobody else is waiting to be paired right now.'); } S.pair={state:'proposed',pid:c.id}; render(); },2000); }
function invite(pid){ const k=S.where[pid].type; closeDialog();
  if(k==='lobby'||k==='waiting'){ toast('Invitation sent to '+person(pid).name+'.'); setTimeout(()=>{ toast(person(pid).name+' accepted.'); startDuo(pid); },2200); }
  else if(!S.queued.includes(pid)){ S.queued.push(pid); render(); toast(person(pid).name+' is busy. They will see your invitation when they are back in the lobby.');
    setTimeout(()=>{ if(!S.queued.includes(pid)) return; S.queued=S.queued.filter(x=>x!==pid); const w=S.where[pid]; if(w.type==='room'){const t=S.tables[w.room][w.table]; t.splice(t.indexOf(pid),1);} S.where[pid]={type:'lobby'}; render();
      dialog(`<p class="eyebrow">Table for two</p><h2>${esc(person(pid).name)} is free and accepted</h2><p>Your queued invitation was delivered when they returned to the lobby.</p><div class="dlg-actions"><button class="btn" data-act="close">Not now</button><button class="btn primary" data-act="startduo" data-id="${pid}">Open our table</button></div>`); },7000); } }
function suggest(){ const c=[]; ROOMS.forEach(r=>S.tables[r.id].forEach((t,ti)=>{ if(t.length<CAP&&!t.includes('me')) c.push({r,ti,score:r.tags.filter(x=>S.me.interests.includes(x)).length*3+(t.length?2:0)-t.length*.5-t.filter(id=>S.met.includes(id)).length}); }));
  c.sort((a,b)=>b.score-a.score); if(!c[0]) return; S.sel=c[0].r.id; render(); const el=document.querySelector(`[data-room="${S.sel}"]`); if(el){ el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); el.focus&&el.focus({preventScroll:true}); }
  toast('Suggested: '+c[0].r.title+'. It matches your interests and has space.'); }

/* ---------- shared UI fragments ---------- */
const avatar = (p,cls='') => `<span class="av ${cls}" style="--c:${p.colour}" aria-hidden="true">${esc(initials(p))}</span>`;
const kindDot = id => `<i class="dot ${locKind(id)}" aria-hidden="true"></i>`;
function personRow(p){ return `<button class="prow" data-act="person" data-id="${p.id}">${avatar(p)}<span class="prow-main"><strong>${esc(p.name)}</strong><span class="prow-sub">${esc(p.aff)}</span><span class="prow-loc">${kindDot(p.id)}${esc(locLabel(p.id))}</span></span></button>`; }
function roomActions(rid){ const ts=S.tables[rid], mine=S.loc.type==='room'&&S.loc.room===rid; let h='';
  if(mine) h+=`<button class="btn primary" data-act="reopen">Reopen Meet</button><button class="btn" data-act="leave">I've left</button>`;
  else { ts.forEach((t,ti)=>{ const label=ts.length>1?`table ${ti+1}`:''; h+= t.length>=CAP ? `<button class="btn" disabled>${label||'Room'} full</button>` : `<button class="btn primary" data-act="join" data-room="${rid}" data-t="${ti}">${t.length?'Join':'Start'} ${label||'this conversation'}</button>`; });
    if(ts.every(t=>t.length>=CAP)) h+=`<button class="btn" data-act="opentable" data-room="${rid}">Open table ${ts.length+1}</button>`; }
  return h; }
function tableMeta(rid,ti){ const n=S.tables[rid][ti].length; return n ? `${n} of ${CAP} · going ${minutesGoing(rid,ti)} min` : 'Empty · be the first'; }
function seatDots(rid,ti){ const t=S.tables[rid][ti]; let h='<span class="seats" aria-hidden="true">'; for(let i=0;i<CAP;i++){ const p=t[i]&&person(t[i]); h+= p?`<i class="seat on" style="--c:${p.colour}">${esc(initials(p))}</i>`:'<i class="seat"></i>'; } return h+'</span>'; }
function roomPeople(rid){ return S.tables[rid].map((t,ti)=> (S.tables[rid].length>1?`<p class="tlabel">Table ${ti+1} · ${tableMeta(rid,ti)}</p>`:'') + (t.length? t.map(id=>{const p=person(id); return `<button class="pmini" data-act="person" data-id="${id}">${avatar(p,'sm')}<span><strong>${esc(p.name)}</strong> · ${esc(p.aff)}<br><span class="fine">${esc(id==='me'?p.ask:(parseInt(id.slice(1))%2?p.ask:p.offer))}</span></span></button>`;}).join('') : '<p class="fine">Nobody yet. Start it and others will see you here.</p>')).join(''); }
function statusHTML(){ const l=S.loc; let h=`<div class="st-line">${avatar(S.me,'sm')}<span><strong>${esc(S.me.name)}</strong><br><span class="fine">${esc(locLabel('me'))}</span></span></div><div class="st-actions">`;
  if(l.type==='room'||l.type==='duo') h+=`<span class="chip timer" data-timer></span><button class="btn sm primary" data-act="reopen">Reopen Meet</button><button class="btn sm" data-act="leave">I've left</button>`;
  else if(l.type==='waiting') h+=`<button class="btn sm" data-act="leave">Stop waiting</button>`;
  else if(l.type==='break') h+=`<button class="btn sm primary" data-act="leave">I'm back</button>`;
  else h+=`<button class="btn sm primary" data-act="suggest">Take me somewhere</button><button class="btn sm" data-act="break">Take a break</button>`;
  h+='</div>'; if(S.nudge) h+=`<div class="nudge" role="status"><strong>12 minutes.</strong> A good moment to move on, if you like. <button class="link" data-act="suggest">Suggest a room</button> · <button class="link" data-act="nudgeoff">Stay</button></div>`;
  return h; }
function duoHTML(){ let h='';
  if(S.pair&&S.pair.state==='searching') h+=`<div class="pairbox" role="status"><strong>Looking for a match…</strong><span class="fine">Prefers shared interests and people you have not met.</span><button class="btn sm" data-act="paircancel">Cancel</button></div>`;
  else if(S.pair&&S.pair.state==='proposed'){ const p=person(S.pair.pid); const sh=p.interests.filter(x=>S.me.interests.includes(x)); h+=`<div class="pairbox" role="alert"><strong>Match: ${esc(p.name)}</strong><span class="fine">${esc(p.aff)}${sh.length?' · shared: '+esc(sh.join(', ')):''}</span><span class="fine">${esc(p.ask)}</span><span><button class="btn sm primary" data-act="pairaccept">Accept</button> <button class="btn sm" data-act="paircancel">Decline quietly</button></span></div>`; }
  else h+=`<div class="duo-actions"><button class="btn primary" data-act="pairme">Pair me with someone</button><button class="btn" data-act="sitduo">Sit at an open table</button></div>`;
  h+='<ul class="duolist">';
  S.waiting.forEach(id=>{const p=person(id); h+=`<li>${avatar(p,'sm')}<span><strong>${esc(p.name)}</strong> is waiting<br><span class="fine">${esc(p.ask)}</span></span><button class="btn sm primary" data-act="startduo" data-id="${id}">Sit down</button></li>`;});
  if(S.loc.type==='waiting') h+=`<li>${avatar(S.me,'sm')}<span><strong>You</strong> are waiting at an open table</span></li>`;
  S.duos.forEach(([a,b])=>{ h+=`<li class="busy">${avatar(person(a),'sm')}${avatar(person(b),'sm')}<span>${esc(person(a).name.split(' ')[0])} and ${esc(person(b).name.split(' ')[0])}<br><span class="fine">In conversation · private</span></span></li>`;});
  if(S.loc.type==='duo') h+=`<li class="busy">${avatar(S.me,'sm')}${avatar(person(S.loc.other),'sm')}<span>You and ${esc(person(S.loc.other).name.split(' ')[0])}</span></li>`;
  h+='</ul>'; if(S.queued.length) h+=`<p class="fine">Queued invitations: ${S.queued.map(id=>esc(person(id).name)).join(', ')}. Delivered when they return to the lobby.</p>`;
  return h; }
function metHTML(){ return S.met.length ? '<ul class="metlist">'+S.met.map(id=>{const p=person(id); return `<li>${avatar(p,'sm')}<span><strong>${esc(p.name)}</strong><br><span class="fine">${esc(p.aff)}</span></span><button class="btn sm" data-act="follow" data-id="${id}">Follow up</button></li>`;}).join('')+'</ul>' : '<p class="fine">Private to you. Fills in as you join conversations.</p>'; }
function scenarioHTML(){ return `<span class="demo-tag">Demo · synthetic people</span><span class="seg" role="group" aria-label="Demo attendance">${SCEN.map((s,i)=>`<button data-act="scenario" data-i="${i}" aria-pressed="${i===S.scenario}">${s.total}</button>`).join('')}</span>`; }

/* ---------- dialogs ---------- */
function dialog(html){ const d=$('dlg'); d.innerHTML=html; if(!d.open) d.showModal(); }
function closeDialog(){ const d=$('dlg'); if(d.open) d.close(); }
let toastTimer; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3600); }
function personDialog(id){ const p=person(id), k=locKind(id), w=S.where[id]; let act='';
  if(id!=='me'){ if(w.type==='room'&&S.tables[w.room][w.table].length<CAP&&!(S.loc.type==='room'&&S.loc.room===w.room&&S.loc.table===w.table)) act+=`<button class="btn" data-act="join" data-room="${w.room}" data-t="${w.table}">Join their conversation</button>`;
    if(w.type==='waiting') act+=`<button class="btn primary" data-act="startduo" data-id="${id}">Sit down with them</button>`;
    else if(w.type!=='break') act+=`<button class="btn primary" data-act="invite" data-id="${id}">${k==='lobby'?'Invite to a table for two':'Invite when they are free'}</button>`; }
  dialog(`<div class="pcard-head">${avatar(p,'lg')}<div><h2>${esc(p.name)}</h2><p>${esc(p.aff)}</p><p class="prow-loc">${kindDot(id)}${esc(locLabel(id))}</p></div></div><p class="chips">${p.interests.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</p><dl class="askoffer"><dt>Ask</dt><dd>${esc(p.ask)}</dd><dt>Offer</dt><dd>${esc(p.offer)}</dd></dl>${S.met.includes(id)?'<p class="fine">You have met.</p>':''}<div class="dlg-actions"><button class="btn" data-act="close">Close</button>${act}</div>`); }
function profileDialog(){ const m=S.me; dialog(`<h2>Your profile</h2><p class="fine">Shown to other attendees in this lobby only.</p><label>Name<input id="f-name" maxlength="40" value="${esc(m.name)}"></label><label>Affiliation<input id="f-aff" maxlength="60" value="${esc(m.aff)}"></label><fieldset><legend>Interests</legend><div class="chips">${INTERESTS.map(x=>`<button type="button" class="chip toggle" data-act="interest" data-x="${esc(x)}" aria-pressed="${m.interests.includes(x)}">${esc(x)}</button>`).join('')}</div></fieldset><label>One ask<input id="f-ask" maxlength="140" value="${esc(m.ask)}"></label><label>One offer<input id="f-offer" maxlength="140" value="${esc(m.offer)}"></label><div class="dlg-actions"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="saveprofile">Save</button></div>`); }
function helpDialog(){ dialog(`<p class="eyebrow">Help desk</p><h2>Organisers are here</h2><div class="help-grid"><button class="help-opt" data-act="helpmeet"><strong>Talk to an organiser</strong><span>Staffed Google Meet room, open for the whole session.</span></button><button class="help-opt" data-act="helpreport"><strong>Report a concern</strong><span>Private. Seen only by the conduct team.</span></button></div><h3>Message the organisers</h3><div class="chatlog" id="chatlog" aria-live="polite">${chatHTML()}</div><form class="chatform" data-form="chat"><input id="chatinput" aria-label="Message" placeholder="Type a message" autocomplete="off"><button class="btn primary">Send</button></form><div class="dlg-actions"><button class="btn" data-act="close">Close</button></div>`); }
const chatHTML = () => S.chat.length ? S.chat.map(m=>`<p class="msg ${m.me?'me':''}"><span>${esc(m.t)}</span></p>`).join('') : '<p class="fine">Typical reply time: under two minutes.</p>';
function metDialog(){ dialog(`<h2>People I met</h2>${metHTML()}<div class="dlg-actions"><button class="btn primary" data-act="close">Close</button></div>`); }
function duoDialog(){ dialog(`<p class="eyebrow">Table for two</p><h2>A ten-minute one-to-one</h2><div id="duo-in-dlg">${duoHTML()}</div><div class="dlg-actions"><button class="btn" data-act="close">Close</button></div>`); }

/* ---------- wiring ---------- */
function render(){ window.renderLayout(); const d=$('duo-in-dlg'); if(d) d.innerHTML=duoHTML(); tick(); }
function tick(){ document.querySelectorAll('[data-timer]').forEach(el=>{ if(!S.joinedAt) return; const s=Math.floor((Date.now()-S.joinedAt)/1000); el.innerHTML=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} · nudge at 12:00 <button class="link" data-act="nudge">preview</button>`; if(s>=720&&!S.nudge){S.nudge=true;render();} }); }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act, id=b.dataset.id;
  ({ close:closeDialog, join:()=>{closeDialog();join(b.dataset.room,+b.dataset.t);}, opentable:()=>openTable(b.dataset.room), leave:()=>{vacate();render();toast('You are back in the lobby.');},
     reopen:()=>meet(locLabel('me').replace(/^In |^At a /,'')), break:()=>{vacate();S.loc={type:'break'};render();}, suggest:()=>{S.nudge=false;suggest();}, sitduo:sitDuo, startduo:()=>{closeDialog();startDuo(id);},
     pairme:pairMe, pairaccept:()=>startDuo(S.pair.pid), paircancel:()=>{S.pair=null;render();}, person:()=>personDialog(id), invite:()=>invite(id), help:helpDialog, profile:profileDialog, met:metDialog, duo:duoDialog,
     helpmeet:()=>meet('Organiser help desk'), helpreport:()=>dialog(`<h2>Report a concern</h2><p class="fine">Goes only to the two named conduct contacts. You can stay anonymous.</p><label>What happened?<textarea rows="4"></textarea></label><div class="dlg-actions"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="reportsent">Send privately</button></div>`),
     reportsent:()=>{closeDialog();toast('Sent privately to the conduct team.');}, follow:()=>toast('Would open a Slack direct message with '+person(id).name+'.'),
     interest:()=>b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true')), saveprofile:()=>{ S.me.name=$('f-name').value.trim()||'You'; S.me.aff=$('f-aff').value.trim(); S.me.ask=$('f-ask').value.trim(); S.me.offer=$('f-offer').value.trim(); S.me.interests=[...document.querySelectorAll('.chip.toggle[aria-pressed="true"]')].map(x=>x.dataset.x); closeDialog(); render(); toast('Profile saved.'); },
     scenario:()=>{seed(+b.dataset.i);render();}, select:()=>{S.sel=S.sel===b.dataset.room&&b.dataset.toggle?null:b.dataset.room;render();}, nudge:()=>{S.nudge=true;render();}, nudgeoff:()=>{S.nudge=false;S.joinedAt=Date.now();render();},
     popout:()=>window.open(location.href,'crossroads','width=420,height=820') }[a]||(()=>window.layoutAct&&window.layoutAct(a,b)))(); });
document.addEventListener('submit',e=>{ if(e.target.dataset.form!=='chat') return; e.preventDefault(); const i=$('chatinput'), t=i.value.trim(); if(!t) return; S.chat.push({me:true,t}); i.value=''; $('chatlog').innerHTML=chatHTML();
  setTimeout(()=>{ S.chat.push({t:'Thanks, an organiser has seen this and will reply here. If it is urgent, use "Talk to an organiser".'}); const c=$('chatlog'); if(c){c.innerHTML=chatHTML();c.scrollTop=c.scrollHeight;} },1200); });
document.addEventListener('input',e=>{ if(e.target.matches('[data-search]')){ S.q=e.target.value; window.renderLayout(); } });
document.addEventListener('DOMContentLoaded',()=>{ document.body.insertAdjacentHTML('beforeend','<dialog id="dlg"></dialog><div id="toast" role="status" aria-live="polite"></div>'); $('dlg').addEventListener('click',e=>{ if(e.target.id==='dlg') closeDialog(); }); seed(1); render(); setInterval(tick,1000); });

let tab='rooms'; const TABS={rooms:'Rooms',people:'People',duo:'For two',me:'Me'};
window.layoutAct=(a,b)=>{ if(a==='tab'){tab=b.dataset.tab;render();$('pane').scrollTop=0;} if(a==='float') floatPanel(); };
/* Always-on-top lobby: Document Picture-in-Picture (Chrome, Edge; needs https or localhost). Falls back to a small pop-out window. */
async function floatPanel(){
  if(!('documentPictureInPicture' in window)){ window.open(location.pathname+'?panel','crossroads','width=400,height=820'); return; }
  const w=await documentPictureInPicture.requestWindow({width:400,height:760});
  w.document.body.style.margin='0'; const f=w.document.createElement('iframe'); f.src=location.pathname+'?panel'; f.title='Crossroads lobby'; f.style.cssText='border:0;width:100vw;height:100vh;display:block'; w.document.body.append(f);
  document.body.classList.add('floated'); w.addEventListener('pagehide',()=>document.body.classList.remove('floated'));
}
if(location.search.includes('panel')||self!==top) document.documentElement.classList.add('panel');
const _suggest=suggest; suggest=function(){ tab='rooms'; _suggest(); };
window.renderLayout=()=>{
  $('scen').innerHTML=scenarioHTML(); $('status').innerHTML=statusHTML();
  $('tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button role="tab" aria-selected="${tab===k}" data-act="tab" data-tab="${k}">${v}${k==='duo'&&S.waiting.length?' · '+S.waiting.length:''}</button>`).join('');
  const pane=$('pane'); const had=document.activeElement&&document.activeElement.matches('[data-search]');
  if(tab==='rooms') pane.innerHTML=ROOMS.map(r=>{const n=S.tables[r.id].reduce((a,x)=>a+x.length,0),open=S.sel===r.id; return `<section class="acc ${open?'sel':''}"><button class="acc-h" data-room="${r.id}" data-act="select" data-toggle="1" aria-expanded="${open}"><strong>${esc(r.title)}</strong>${seatDots(r.id,S.tables[r.id].length-1)}<span class="fine">${esc(r.topic)} · ${n?n+' here'+(S.tables[r.id].length>1?' at '+S.tables[r.id].length+' tables':'')+' · going '+minutesGoing(r.id,0)+' min':'empty, start it'}</span></button>${open?`<div class="acc-b"><p class="fine">${esc(r.desc)}</p><blockquote>${esc(r.prompt)}</blockquote>${roomPeople(r.id)}<div class="acts">${roomActions(r.id)}</div></div>`:''}</section>`;}).join('');
  if(tab==='people'){ if(!pane.querySelector('[data-search]')) pane.innerHTML=`<input data-search type="search" aria-label="Search people" placeholder="Name, interest, ask or offer" value="${esc(S.q)}"><div class="plist" id="plist"></div>`; $('plist').innerHTML=search(S.q).map(personRow).join('')||'<p class="fine">Nobody matches.</p>'; }
  if(tab==='duo') pane.innerHTML=`<h2>Table for two</h2><p class="fine">A ten-minute one-to-one in its own Meet. Get paired, wait at an open table, or invite someone from the People tab.</p>${duoHTML()}`;
  if(tab==='me') pane.innerHTML=`<h2>${esc(S.me.name)}</h2><p class="fine">${esc(S.me.aff)}</p><p class="chips">${S.me.interests.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</p><dl class="askoffer"><dt>Ask</dt><dd>${esc(S.me.ask)}</dd><dt>Offer</dt><dd>${esc(S.me.offer)}</dd></dl><p style="margin-top:.8em"><button class="btn" data-act="profile">Edit profile</button></p><h3 style="margin-top:1.2em">People I met</h3>${metHTML()}`;
};
</script></body></html>
